name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-timeout flake8 black
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=79 --statistics
    
    - name: Check code formatting with black
      run: |
        black --check --diff .
    
    - name: Run Python tests with timeouts
      run: |
        python scripts/test_runner.py --python --config test_config.json
      continue-on-error: true
    
    - name: Run legacy pytest tests
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=html --timeout=30
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  java-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Java tests with timeouts
      run: |
        python scripts/test_runner.py --java --config test_config.json
      continue-on-error: true
    
    - name: Compile Java files
      run: |
        find . -name "*.java" -exec javac {} \;
    
    - name: Check Java code style
      run: |
        # Add checkstyle or similar tool here
        echo "Java style check placeholder"

  documentation:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Sync code to textbook
      run: |
        python scripts/sync_code_to_textbook.py
    
    - name: Check if textbook was updated
      run: |
        if [ -n "$(git status --porcelain COMPREHENSIVE_COURSE_TEXTBOOK.md)" ]; then
          echo "Textbook needs to be updated. Run: python scripts/sync_code_to_textbook.py"
          git diff COMPREHENSIVE_COURSE_TEXTBOOK.md
          exit 1
        fi
    
    - name: Check documentation links
      run: |
        # Add link checker here
        echo "Documentation check placeholder"
    
    - name: Validate README files
      run: |
        # Check all README.md files exist and are valid
        find . -name "README.md" -type f | wc -l

