<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"><defs><style> .box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; } .diamond { fill: #fff3cd; stroke: #ff9800; stroke-width: 2; } .start { fill: #d4edda; stroke: #28a745; stroke-width: 2; } .end { fill: #f8d7da; stroke: #dc3545; stroke-width: 2; } .text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; } </style></defs><!-- Start --><rect x="150" y="20" width="100" height="40" rx="5" class="start"/><text x="200" y="45" class="text">Start</text><!-- Initialize --><rect x="150" y="80" width="100" height="40" rx="5" class="box"/><text x="200" y="105" class="text">Initialize</text><!-- Process --><polygon points="200,140 250,180 200,220 150,180" class="diamond"/><text x="200" y="185" class="text">Process?</text><!-- Execute --><rect x="150" y="240" width="100" height="40" rx="5" class="box"/><text x="200" y="265" class="text">Execute</text><!-- End --><rect x="150" y="320" width="100" height="40" rx="5" class="end"/><text x="200" y="345" class="text">End</text><!-- Arrows --><line x1="200" y1="60" x2="200" y2="80" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><line x1="200" y1="120" x2="200" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><line x1="200" y1="220" x2="200" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><line x1="200" y1="280" x2="200" y2="320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><!-- Arrowhead marker --><defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#333"/></marker></defs></svg>